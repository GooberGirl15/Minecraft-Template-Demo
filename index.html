            </div>

</div>
    <script>
        const clickableArea = document.getElementById("inventory-button");
        var inventoryModal = document.getElementById("inventory");
        const ignoreLink = document.querySelector('a');
        const audioPlayer = document.getElementById("soundtrack");
        const audioPlayerContainer = document.getElementById("music-player");
        const soundIcon = document.getElementById("sound-icon");
        const buttonSoundEffect = document.getElementById("open-button-sound");


        const itemsInInventory = document.getElementsByClassName("item");
        const itemModals = document.getElementsByClassName("item-tooltip");

        var isPlaying = false;
        var muteIcon = true;

        clickableArea.addEventListener("click",openInventory);
        audioPlayerContainer.addEventListener("click", toggleAudio);
        soundIcon.addEventListener("click", toggleIcon);


        function openInventory(e){
            inventoryModal.style.display = "block";
            buttonSoundEffect.play();
        }

        function toggleAudio(e){
            isPlaying ? enableMute(e) : disableMute(e);
        }
        function toggleIcon(e){
            muteIcon ? muteIconDisabled(e) : muteIconEnabled(e);
        }

        function enableMute(){
            audioPlayer.muted = true;
            audioPlayer.volume = 0;
            buttonSoundEffect.volume = 0;
            isPlaying = false;
        }

        function disableMute(){
            audioPlayer.muted = false;
            buttonSoundEffect.volume = 1;
            audioPlayer.volume = 1;
            audioPlayer.play();
            isPlaying = true;
        }

        function muteIconEnabled(){
            soundIcon.src = "sound-icon-muted.png";
            muteIcon = true;
        }

        function muteIconDisabled(){
            soundIcon.src = "sound-icon-playing.png";
            muteIcon = false;
        }

        window.onclick = function(event){
            if (event.target == inventoryModal){
                inventoryModal.style.display = "none";
            }
        }


        Array.from(itemsInInventory).forEach((item =>{
            item.addEventListener("mouseover", openItemTooltip);
            item.addEventListener("mouseleave", closeItemTooltip);

        }));

        function openItemTooltip(e){
            const currentItem = e.currentTarget.getElementsByClassName("item-tooltip");
            Array.from(currentItem).forEach((item =>{
                item.style.display = "block";
            }))
        }

        function closeItemTooltip(e){
            const currentItem = e.currentTarget.getElementsByClassName("item-tooltip");
            Array.from(currentItem).forEach((item =>{
                item.style.display = "none";
            }))

        }

    </script>

    
</body>
